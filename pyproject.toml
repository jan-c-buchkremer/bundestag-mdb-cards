[project]
name = "bundestag-mdb-cards"
version = "0.1.0"
description = "One info card per member of the 21st Bundestag, every fact linked to its source"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
cards = "cards.cli:main"

[dependency-groups]
dev = [
    "pyshp>=3.1.6",
    "pytest>=8",
    "ruff>=0.6",
    "shapely>=2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cards"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
