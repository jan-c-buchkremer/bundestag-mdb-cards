[project]
name = "bundestag-research-platform"
version = "0.1.0"
description = "The research platform of plenar-radar.de: every member, Vorgang, sitting, speech and vote of the 21st Bundestag, linked to each other and to the source"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pagefind[extended]>=1.5.2",
    "pillow>=12.3.0",
]

[project.scripts]
research = "research.cli:main"

[dependency-groups]
dev = [
    "pyshp>=3.1.6",
    "pytest>=8",
    "ruff>=0.6",
    "shapely>=2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
